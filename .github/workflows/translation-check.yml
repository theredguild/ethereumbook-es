name: Check translation build

on:
  pull_request:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: translation-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Check transaction lab invariants
        run: npm run test:labs
      - name: Build Vocs book
        run: npm run build
