<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="710" viewBox="0 0 1140 710">
<title>Cálculo y envío de la prueba KZG</title><desc>El probador calcula la prueba π de las evaluaciones p(x1) = y1 y p(x2) = y2. Una flecha roja lleva del polinomio a π y una flecha ascendente envía π al verificador.</desc>
<defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#111"/></marker><marker id="r" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#c5222b"/></marker><g id="person" stroke="#111" stroke-width="3"><circle cy="-30" r="27" fill="#ddd"/><path d="M-50 56V24Q-50 2 0 2Q50 2 50 24V56Z" fill="#ececec"/></g></defs>
<g font-family="DejaVu Sans" font-size="30" fill="#111"><g fill="none" stroke="#111" stroke-width="6" stroke-linecap="round" marker-end="url(#a)"><path d="M5 395H600"/><path d="M315 700V102"/><path d="M975 335V240"/></g>
<path d="M60 555C120 538 133 398 177 350S241 334 282 342S372 357 404 313S457 238 500 238S521 205 545 195" fill="none" stroke="#0075b9" stroke-width="12" stroke-linecap="round"/>
<path d="M199 395V346H315M315 240H478V395" fill="none" stroke="#c5222b" stroke-width="6" stroke-linecap="round" stroke-dasharray="4 13"/>
<g fill="#c5222b" font-style="italic"><text x="345" y="46">p(x1) = y1</text><text x="341" y="89">p(x2) = y2</text><text x="199" y="433" text-anchor="middle">x1</text><text x="478" y="433" text-anchor="middle">x2</text><text x="306" y="379" text-anchor="end">y1</text><text x="306" y="251" text-anchor="end">y2</text></g>
<path d="M610 400H900" stroke="#c5222b" stroke-width="6" marker-end="url(#r)"/><text x="755" y="381" text-anchor="middle" fill="#c5222b" font-size="27" font-style="italic">Prueba KZG</text><path d="M975 335Q980 335 990 345L1030 385Q1045 400 1030 415L990 455Q975 470 960 455L920 415Q905 400 920 385L960 345Q970 335 975 335Z" fill="#b2d5e8" stroke="#111" stroke-width="4"/><text x="975" y="411" text-anchor="middle">π</text>
