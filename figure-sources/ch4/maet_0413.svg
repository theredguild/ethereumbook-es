<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
<title>Codificación de datos en un polinomio</title><desc>El probador codifica datos, representados por un rectángulo azul, en el polinomio p. Una flecha roja une los datos con la gráfica azul del polinomio.</desc>
<defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#111"/></marker><marker id="r" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#c5222b"/></marker></defs>
<g font-family="DejaVu Sans" font-size="30" fill="#111"><rect x="370" y="5" width="175" height="220" rx="18" fill="none" stroke="#111" stroke-width="4"/><circle cx="457" cy="60" r="27" fill="#ddd" stroke="#111" stroke-width="3"/><path d="M407 146V114Q407 92 457 92Q507 92 507 114V146Z" fill="#ececec" stroke="#111" stroke-width="3"/><text x="457" y="198" text-anchor="middle">Probador</text>
<rect x="5" y="270" width="175" height="85" rx="18" fill="#b2d5e8" stroke="#111" stroke-width="4"/><text x="92" y="325" text-anchor="middle">Datos</text><path d="M180 313H450" stroke="#c5222b" stroke-width="6" marker-end="url(#r)"/><text x="315" y="295" fill="#c5222b" font-size="26" text-anchor="middle" font-style="italic">Codificación</text>
<g fill="none" stroke="#111" stroke-width="6" stroke-linecap="round" marker-end="url(#a)"><path d="M465 313H990"/><path d="M740 590V45"/></g>
<path d="M495 472C555 455 568 315 612 267S676 251 717 259S807 274 839 230S892 155 935 155S956 122 980 112" fill="none" stroke="#0075b9" stroke-width="12" stroke-linecap="round"/><text x="802" y="295">Polinomio p</text>
</g></svg>
