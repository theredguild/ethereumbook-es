<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<title>Agregación de firmas BLS</title><desc>Tres votos separados se guardan en el bloque A a la izquierda. A la derecha, los mismos tres votos se agregan en una sola firma antes de guardarse en el bloque A.</desc>
