<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" xml:lang="es-419"><title>Oráculo de solicitud-respuesta</title><desc>Siete pasos numerados; usuario, contrato, oráculo y recolector en fila; proceso externo debajo del oráculo. Lectura superior del contrato dirigida al oráculo.</desc><defs><marker id="arrow" markerWidth="24" markerHeight="24" refX="22" refY="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L22 12L0 24Z" fill="black"/></marker></defs><g font-family="DejaVu Sans"><path d="M240 190H420" fill="none" stroke="black" stroke-width="5" marker-end="url(#arrow)"/><path d="M700 190H870" fill="none" stroke="black" stroke-width="5" marker-end="url(#arrow)"/><path d="M1150 190H1330" fill="none" stroke="black" stroke-width="5" marker-end="url(#arrow)"/><path d="M1470 130V48H1060V130" fill="none" stroke="black" stroke-width="5" marker-end="url(#arrow)"/><path d="M1000 380V250" fill="none" stroke="black" stroke-width="5" marker-end="url(#arrow)"/><path d="M870 430H560V250" fill="none" stroke="black" stroke-width="5" marker-end="url(#arrow)"/><path d="M560 130V48H965V130" fill="none" stroke="black" stroke-width="5" marker-end="url(#arrow)"/><rect x="5" y="130" width="235" height="120" rx="16" fill="#b4d5e8" stroke="black" stroke-width="3"/><text x="122.5" y="198.4" text-anchor="middle" font-size="24"><tspan x="122.5" dy="0">Usuario</tspan></text><rect x="420" y="130" width="280" height="120" rx="16" fill="#b4d5e8" stroke="black" stroke-width="3"/><text x="560.0" y="198.05" text-anchor="middle" font-size="23"><tspan x="560.0" dy="0">Contrato inteligente</tspan></text><rect x="870" y="130" width="280" height="120" rx="16" fill="#b4d5e8" stroke="black" stroke-width="3"/><text x="1010.0" y="198.4" text-anchor="middle" font-size="24"><tspan x="1010.0" dy="0">Oráculo</tspan></text><rect x="1330" y="130" width="265" height="120" rx="16" fill="#b4d5e8" stroke="black" stroke-width="3"/><text x="1462.5" y="184.75" text-anchor="middle" font-size="21"><tspan x="1462.5" dy="0">Recolector de datos</tspan><tspan x="1462.5" dy="25.2">fuera de la cadena</tspan></text><rect x="870" y="380" width="280" height="115" rx="16" fill="#b4d5e8" stroke="black" stroke-width="3"/><text x="1010.0" y="432.25" text-anchor="middle" font-size="21"><tspan x="1010.0" dy="0">Proceso en segundo</tspan><tspan x="1010.0" dy="25.2">plano fuera de la cadena</tspan></text><text x="330" y="150" text-anchor="middle" font-size="21" font-style="italic"><tspan x="330" dy="0">1. Interactúa</tspan></text><text x="785" y="119" text-anchor="middle" font-size="21" font-style="italic"><tspan x="785" dy="0">2. Solicita</tspan><tspan x="785" dy="25.2">datos</tspan></text><text x="1240" y="92" text-anchor="middle" font-size="20" font-style="italic"><tspan x="1240" dy="0">3. Obtiene datos</tspan><tspan x="1240" dy="24.0">fuera de la cadena</tspan></text><text x="1260" y="28" text-anchor="middle" font-size="22" font-style="italic"><tspan x="1260" dy="0">4. Envía los datos actualizados al oráculo</tspan></text><text x="1260" y="304" text-anchor="middle" font-size="22" font-style="italic"><tspan x="1260" dy="0">5. Lee los registros</tspan><tspan x="1260" dy="26.4">del oráculo actualizado</tspan></text><text x="710" y="300" text-anchor="middle" font-size="21" font-style="italic"><tspan x="710" dy="0">6. Notifica al contrato</tspan><tspan x="710" dy="25.2">inteligente que el</tspan><tspan x="710" dy="25.2">oráculo se actualizó</tspan></text><text x="765" y="28" text-anchor="middle" font-size="22" font-style="italic"><tspan x="765" dy="0">7. Lee</tspan></text></g></svg>