<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" xml:lang="es-419"><title>Oráculo de publicación-suscripción</title><desc>Actualización entrante al oráculo; proceso externo lee registros y notifica al contrato, que lee el oráculo.</desc><defs><marker id="arrow" markerWidth="24" markerHeight="24" refX="22" refY="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L22 12L0 24Z" fill="black"/></marker></defs><g font-family="DejaVu Sans"><path d="M180 5V100" fill="none" stroke="black" stroke-width="5" marker-end="url(#arrow)"/><path d="M745 150H360" fill="none" stroke="black" stroke-width="5" marker-end="url(#arrow)"/><path d="M920 200V350H360" fill="none" stroke="black" stroke-width="5" marker-end="url(#arrow)"/><path d="M180 300V200" fill="none" stroke="black" stroke-width="5" marker-end="url(#arrow)"/><rect x="5" y="100" width="355" height="100" rx="16" fill="#b4d5e8" stroke="black" stroke-width="3"/><text x="182.5" y="158.4" text-anchor="middle" font-size="24"><tspan x="182.5" dy="0">Oráculo</tspan></text><rect x="745" y="100" width="350" height="100" rx="16" fill="#b4d5e8" stroke="black" stroke-width="3"/><text x="920.0" y="144.5" text-anchor="middle" font-size="22"><tspan x="920.0" dy="0">Proceso en segundo</tspan><tspan x="920.0" dy="26.4">plano fuera de la cadena</tspan></text><rect x="5" y="300" width="355" height="95" rx="16" fill="#b4d5e8" stroke="black" stroke-width="3"/><text x="182.5" y="355.9" text-anchor="middle" font-size="24"><tspan x="182.5" dy="0">Contrato inteligente</tspan></text><text x="295" y="42" text-anchor="middle" font-size="23" font-style="italic"><tspan x="295" dy="0">1. Actualiza</tspan></text><text x="550" y="60" text-anchor="middle" font-size="22" font-style="italic"><tspan x="550" dy="0">2. Lee los registros</tspan><tspan x="550" dy="26.4">del oráculo actualizado</tspan></text><text x="650" y="260" text-anchor="middle" font-size="22" font-style="italic"><tspan x="650" dy="0">3. Notifica al contrato inteligente</tspan><tspan x="650" dy="26.4">que el oráculo se actualizó</tspan></text><text x="260" y="253" text-anchor="middle" font-size="23" font-style="italic"><tspan x="260" dy="0">4. Lee</tspan></text></g></svg>