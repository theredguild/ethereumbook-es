<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="730" viewBox="0 0 1050 730" lang="es-419">
<title>Comparación de zk-EVM y zk-VM</title>
<desc>Geth alimenta cada máquina y ambas producen una prueba. Circuitos personalizados en naranja; circuitos listos para usar en azul. Se conservan las dos líneas de los circuitos EVM y Tx que convergen en circuitos zk-EVM.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0 0 L10 5 L0 10 Z" fill="#000"/>
</marker>
