<text x="29.0" y="29.0" text-anchor="middle" dominant-baseline="central" font-size="28" fill="#000">
</text>
<text x="62" y="38" text-anchor="start" font-size="24" font-style="italic">Caja negra lista para usar</text>
<rect x="510" y="8" width="42" height="42" rx="15" fill="#facb90" stroke="#000" stroke-width="4"/>
<text x="531.0" y="29.0" text-anchor="middle" dominant-baseline="central" font-size="28" fill="#000">
</text>
<text x="565" y="28" text-anchor="start" font-size="23" font-style="italic">Debe escribirla y mantenerla</text>
<text x="565" y="58" text-anchor="start" font-size="23" font-style="italic">manualmente</text>
