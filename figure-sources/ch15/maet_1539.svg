<svg xmlns="http://www.w3.org/2000/svg" width="754" height="739" viewBox="-12 -12 754 739" xml:lang="es-419"><title>Enlaces de supermayoría</title><desc>Bloques azules en filas de tres, flechas de padre hacia izquierda y codos hacia fila previa. Enlace de supermayoría asciende desde 1 a 4 y de 4 a 7; A propone 7 hacia izquierda. No se añaden marcas J/F ni colores ausentes en original.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="black"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="black"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#cb2531"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#009447"/></marker><marker id="pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#df6570"/></marker></defs><g font-family="DejaVu Sans, sans-serif"><rect x="253" y="111" width="101" height="112" rx="14" fill="#b2d3e6" stroke="black" stroke-width="4"/><text x="303.5" y="178.56" font-size="34" fill="black" text-anchor="middle"><tspan x="303.5" dy="0">7</tspan></text><rect x="544" y="0" width="176" height="222" rx="14" fill="white" stroke="black" stroke-width="4"/><path d="M588.0,146.52 Q588.0,102.12 632.0,102.12 Q676.0,102.12 676.0,146.52 Z" fill="#252525" stroke="black" stroke-width="3"/><circle cx="632.0" cy="64.38" r="26.4" fill="#e4b494" stroke="black" stroke-width="3"/><text x="632.0" y="188.7" font-size="26" fill="black" text-anchor="middle"><tspan x="632.0" dy="0">Validador A</tspan></text><polyline points="539,166 358,166" fill="n