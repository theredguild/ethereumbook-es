<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="569" viewBox="-12 -12 1254 569" xml:lang="es-419"><title>Riesgo de cliente con supermayoría</title><desc>Tronco común de dos bloques azules se bifurca en cadenas A arriba y B abajo. A contiene bloque B rojo seguido por tres azules; B tiene cuatro azules. Arco verde une bloques comunes; dos arcos rojos justifican B y siguiente bloque. Globos verde y rojo identifican enlaces.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="black"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="black"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#cb2531"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#009447"/></marker><marker id="pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#df6570"/></marker></defs><g font-family="DejaVu Sans, sans-serif"><rect x="395" y="118" width="832" height="200" rx="14" fill="white" stroke="black" stroke-width="4"/><rect x="395" y="352" width="832" height="187" rx="14" fill="white" stroke="black" stroke-width="4"/><text x="810" y="169" font-size="34" fill="black" text-anchor="middle"><tspan x="810" dy="0">Cadena A</tspan></text><text x="810" y="512" font-size="34" fill="black" text-anchor="middle"><tspan x="810" dy="0">Cadena B</tspan></text><polyline points="160,260 1044,260" fill="none" stroke="black" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="369,260 379,260 379,411 1044,411" fill="none" stroke="black" stroke-wi