<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="604" viewBox="-12 -12 1254 604" xml:lang="es-419"><title>Riesgo de cliente con supermayoría</title><desc>Tronco común de dos bloques azules se bifurca en cadenas A arriba y B abajo. A contiene bloque B rojo seguido por tres azules; B tiene cuatro azules. Arcos rojos discontinuos se conservan sobre A; enlace verde discontinuo va del segundo bloque común a X, tercer bloque de cadena B. Aviso conserva conflicto con flecha saliente de B.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="black"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="black"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#cb2531"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#009447"/></marker><marker id="pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#df6570"/></marker></defs><g font-family="DejaVu Sans, sans-serif"><rect x="395" y="0" width="832" height="202" rx="14" fill="white" stroke="black" stroke-width="4"/><rect x="395" y="235" width="832" height="221" rx="14" fill="white" stroke="black" stroke-width="4"/><text x="810" y="54" font-size="34" fill="black" text-anchor="middle"><tspan x="810" dy="0">Cadena A</tspan></text><text x="810" y="429" font-size="34" fill="black" text-anchor="middle"><tspan x="810" dy="0">Cadena B</tspan></text><polyline points="160,144 1044,144" fill="none" stroke="black" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="369,144 379,144 379,295 1044,295" fill="none" stroke="black" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><rect x="0" y="111" width="158" height="66" rx="14" fill="#b2d3e6" stroke="black" stroke-width="4"/><rect x="210" y="111" width="158" height="66" rx="14" fill="#b2d3e6" stroke="black" stroke-width="4"/><rect x="419" y="111" width="158" height="66" rx="14" fill="#cb2531" stroke="black" stroke-width="4"/><text x="498.0" y="154.2" font-size="30" fill="white" text-anchor="middle"><tspan x="498.0" dy="0">B</tspan></text><rect x="628" y="111" width="158" height="66" rx="14" fill="#b2d3e6" stroke="black" stroke-width="4"/><rect x="836" y="111" width="158" height="66" rx="14" fill="#b2d3e6" stroke="black" stroke-width="4"/><rect x="1045" y="111" width="158" height="66" rx="14" fill="#b2d3e6" stroke="black" stroke-width="4"/><rect x="419" y="262" width="158" height="66" rx="14" fill="#b2d3e6" stroke="black" stroke-width="4"/><rect x="628" y="262" width="158" height="66" rx="14" fill="#b2d3e6" stroke="black" stroke-width="4"/><rect x="836" y="262" width="158" height="66" rx="14" fill="#b2d3e6" stroke="black" stroke-width="4"/><text x="915.0" y="305.2" font-size="30" fill="black" text-anchor="middle"><tspan x="915.0" dy="0">X</tspan></text><rect x="1045" y="262" width="158" height="66" rx="14" fill="#b2d3e6" stroke="black" stroke-width="4"/><path d="M80,111 C80,26 252,26 277,103" fill="none" stroke="#009447" stroke-width="6" marker-end="url(#green)"/><path d="M289,111 C289,26 456,26 481,103" fill="none" stroke="#df6570" stroke-width="6" stroke-dasharray="12 12" marker-end="url(#pink)"/><path d="M499,111 C499,26 668,26 693,103" fill="none" stroke="#df6570" stroke-width="6" stroke-dasharray="12 12" marker-end="url(#pink)"/><polyline points="289,181 289,339 319,375 886,375 914,336" fill="none" stroke="#009447" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#green)" stroke-dasharray="4 12"/><path d="M100 444 H245 Q263 444 278 432 L350 382 Q360 375 353 400 L347 435 Q346 444 364 444 H1080 Q1098 444 1098 462 V555 Q1098 573 1080 573 H100 Q82 573 82 555 V462 Q82 444 100 444Z" fill="#7fc8a4" stroke="black" stroke-width="4"/><text x="590" y="481" font-size="26" fill="black" text-anchor="middle"><tspan x="590" dy="0">Intentar justificar la época X creará atestaciones en conflicto con</tspan><tspan x="590" dy="29.9">la flecha que sale del bloque B. Los validadores participantes</tspan><tspan x="590" dy="29.9">sufrirán slashing.</tspan></text></g></svg>