<svg xmlns="http://www.w3.org/2000/svg" width="509" height="744" viewBox="-12 -12 509 744" xml:lang="es-419"><title>Propuesta de nueva época</title><desc>A arriba derecha propone hacia izquierda al bloque 7. Codo desciende de nuevo bloque a extremo derecho de fila previa. Filas 4,5,6 y 1,2,3 enlazadas con codo 4→3; todos azules, flechas retroceden y barra inferior de tres slots.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="black"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="black"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#cb2531"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#009447"/></marker><marker id="pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#df6570"/></marker></defs><g font-family="DejaVu Sans, sans-serif"><rect x="296" y="0" width="176" height="222" rx="14" fill="white" stroke="black" stroke-width="4"/><path d="M340.0,146.52 Q340.0,102.12 384.0,102.12 Q428.0,102.12 428.0,146.52 Z" fill="#252525" stroke="black" stroke-width="3"/><circle cx="384.0" cy="64.38" r="26.4" fill="#e4b494" stroke="black" stroke-width="3"/><text x="384.0" y="188.7" font-size="26" fill="black" text-anchor="middle"><tspan x="384.0" dy="0">Validador A</tspan></text><polyline points="291,166 108,166" fill="none" stroke="black" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="210" y="147" font-size="26" fill="black" text-anchor="middle" font-style="italic"><tspan x="210" dy="0">Pr