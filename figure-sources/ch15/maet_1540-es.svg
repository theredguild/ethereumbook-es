<svg xmlns="http://www.w3.org/2000/svg" width="1238" height="788" viewBox="0 0 1238 788" xml:lang="es-419">
  <title>Figura 15-40: versión editada en español</title>
  <desc>Traducción educativa de etiquetas visibles mediante superposición a escala nativa. Datos técnicos, curvas, literales y estados originales se conservan. No es una captura nativa en español.</desc>
  <rect id="mask-title" x="76" y="13" width="640" height="48" fill="#0a0a0a"/>
  <text x="77" y="45.5" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#ffffff" font-weight="700">Rentabilidad de los juegos de temporización</text>
  <rect id="mask-daily" x="765" y="30" width="155" height="35" fill="#0a0a0a"/>
  <text x="842.5" y="56.68" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#ffffff">Vista diaria</text>
  <rect id="mask-cumulative" x="961" y="30" width="228" height="35" fill="#0a0a0a"/>
  <text x="1075" y="56" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#ffffff">Vista acumulada</text>
  <rect id="mask-gamers" x="1023" y="137" width="189" height="31" fill="#0a0a0a"/>
  <text x="1024" y="160.32" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#ffffff">Participantes</text>
  <rect id="mask-nongamers" x="1023" y="180" width="189" height="31" fill="#0a0a0a"/>
  <text x="1024" y="202.64" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#ffffff">No participantes</text>
  <rect x="0" y="714" width="1238" height="74" fill="#f5f5f5"/>
  <text x="619" y="743" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#1f2937">Versión editada en español</text>
  <text x="619" y="770" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#1f2937">Traducción educativa; no es una captura nativa.</text>
</svg>
