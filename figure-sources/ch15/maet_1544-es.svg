<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1268" viewBox="0 0 920 1268" xml:lang="es-419">
  <title>Figura 15-44: versión editada en español</title>
  <desc>Traducción educativa de etiquetas visibles mediante superposición a escala nativa. Datos técnicos, curvas, literales y estados originales se conservan. No es una captura nativa en español.</desc>
  <rect id="mask-title" x="242" y="0" width="435" height="51" fill="#ffffff"/>
