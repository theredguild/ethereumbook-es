<svg xmlns="http://www.w3.org/2000/svg" width="754" height="426" viewBox="-12 -12 754 426" xml:lang="es-419"><title>Enlaces de supermayoría</title><desc>Bloques azules en filas de tres, flechas de padre hacia izquierda y codos hacia fila previa. Enlace de supermayoría asciende desde 1 a 4. No se añaden marcas J/F ni colores ausentes en original.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="black"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="black"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#cb2531"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#009447"/></marker><marker id="pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#df6570"/></marker></defs><g font-family="DejaVu Sans, sans-serif"><rect x="253" y="0" width="101" height="112" rx="14" fill="#b2d3e6" stroke="black" stroke-width="4"/><text x="303.5" y="67.56" font-size="34" fill="black" text-anchor="middle"><tspan x="303.5" dy="0">4</tspan></text><polyline points="303,112 303,152 666,152 666,209" fill="none" stroke="black" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="253" y="213" width="101" height="112" rx="14" fill="#b2d3e6" stroke="black" stroke-width="4"/><text x="303.5" y="280.56" font-size="34" fill="black" text-anchor="middle"><tspan x="303.5" dy="0">1</tspan></text><polyline points="435,269 354,269" fill="none" stroke="black" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="435" y="213" width="101" height="112" rx="14" fill="#b2d3e6" stroke="black" stroke-width="4"/><text x="485.5" y="280.56" font-size="34" fill="black" text-anchor="middle"><tspan x="485.5" dy="0">2</tspan></text><polyline points="619,269 536,269" fill="none" stroke="black" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="619" y="213" width="101" height="112" rx="14" fill="#b2d3e6" stroke="black" stroke-width="4"/><text x="669.5" y="280.56" font-size="34" fill="black" text-anchor="middle"><tspan x="669.5" dy="0">3</tspan></text><polyline points="253,269 172,269 172,56 250,56" fill="none" stroke="black" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="84" y="154.5" font-size="24" fill="black" text-anchor="middle" font-style="italic"><tspan x="84" dy="0">Enlace de</tspan><tspan x="84" dy="27.599999999999998">supermayoría</tspan></text><polyline points="253,355 720,355" fill="none" stroke="black" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="486" y="391" font-size="28" fill="black" text-anchor="middle" font-style="italic"><tspan x="486" dy="0">1 época = 3 slots</tspan></text></g></svg>