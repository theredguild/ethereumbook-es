  <rect x="0" y="1194" width="920" height="74" fill="#f5f5f5"/>
  <text x="460" y="1223" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#1f2937">Versión editada en español</text>
  <text x="460" y="1250" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#1f2937">Traducción educativa; no es una captura nativa.</text>
