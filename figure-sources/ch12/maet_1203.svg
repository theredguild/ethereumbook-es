<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc" xml:lang="es-419">
  <title id="title">Arquitectura completa de una DApp</title>
  <desc id="desc">Los contratos inteligentes de Ethereum contienen lógica y base de datos. Una flecha desciende al indexador de blockchain, que se conecta mediante una flecha ascendente y hacia la derecha al frontend oficial alojado en AWS. De este frontend bajan flechas de respaldo a dos frontends alternativos, alojados en Vercel e IPFS.</desc>
  <defs>
    <marker id="arrow" markerWidth="20" markerHeight="20" refX="18" refY="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L20 10L0 20Z" fill="#17212b"/></marker>
    <g id="logic" stroke="#17212b" stroke-width="5" fill="#087db4"><path d="M-18-62H18L21-48L35-41L48-47L65-18L53-8V8L65 18L48 47L35 41L21 48L18 62H-18L-21 48L-35 41L-48 47L-65 18L-53 8V-8L-65-18L-48-47L-35-41L-21-48Z"/><circle r="34" fill="white"/></g>
    <g id="database" stroke="#17212b" stroke-width="5"><path d="M-65-45V45C-65 67 65 67 65 45V-45Z" fill="#087db4"/><path d="M-65-22.5C-65-.5 65-.5 65-22.5M-65 0C-65 22 65 22 65 0M-65 22.5C-65 44.5 65 44.5 65 22.5" fill="none"/><ellipse cy="-45" rx="65" ry="18" fill="#58a7d0"/></g>
  </defs>
  <g stroke="#17212b" stroke-width="4">
    <rect x="4" y="4" width="1272" height="752" rx="20" fill="none"/>
    <rect x="35" y="45" width="585" height="440" rx="20" fill="#b7d6e8"/>
    <rect x="70" y="165" width="245" height="285" rx="18" fill="white"/>
    <rect x="340" y="165" width="245" height="285" rx="18" fill="white"/>
    <rect x="860" y="45" width="255" height="275" rx="18" fill="white"/>
    <rect x="883" y="68" width="209" height="110" rx="18" fill="#b7d6e8"/>
    <rect x="720" y="440" width="250" height="275" rx="18" fill="white"/>
    <rect x="995" y="440" width="250" height="275" rx="18" fill="white"/>
    <rect x="743" y="463" width="204" height="110" rx="18" fill="#b7d6e8"/>
    <rect x="1018" y="463" width="204" height="110" rx="18" fill="#b7d6e8"/>
    <rect x="200" y="575" width="280" height="140" rx="18" fill="white"/>
    <g fill="none" stroke-width="6" marker-end="url(#arrow)">
      <path d="M340 485V571"/><path d="M480 645H675V190H856"/>
      <path d="M932 320V436"/><path d="M1032 320V436"/>
    </g>
  </g>
  <g font-family="DejaVu Sans, sans-serif" fill="#17212b" text-anchor="middle">
    <text x="328" y="100" font-size="32">Contratos inteligentes</text><text x="328" y="140" font-size="32">de Ethereum</text>
    <use href="#logic" transform="translate(192 270)"/><use href="#database" transform="translate(462 270)"/>
    <g font-size="30"><text x="192" y="405">Lógica</text><text x="462" y="390">Base de</text><text x="462" y="429">datos</text>
      <text x="988" y="239">Frontend</text><text x="988" y="281">oficial</text>
      <text x="845" y="635">Frontend</text><text x="845" y="677">alternativo 1</text>
      <text x="1120" y="635">Frontend</text><text x="1120" y="677">alternativo 2</text>
      <text x="340" y="630">Indexador de</text><text x="340" y="673">blockchain</text>
    </g>
    <g font-size="38"><text x="988" y="140">AWS</text><text x="845" y="535">Vercel</text><text x="1120" y="535">IPFS</text></g>
    <text x="1070" y="367" text-anchor="start" font-size="24" font-style="italic">Opciones de</text><text x="1070" y="399" text-anchor="start" font-size="24" font-style="italic">respaldo</text>
  </g>
</svg>
