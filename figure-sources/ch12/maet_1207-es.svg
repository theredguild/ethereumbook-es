<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="964" viewBox="0 0 1220 964" role="img" aria-labelledby="title desc">
<title id="title">Figura 12-7. Versión editada en español</title>
<desc id="desc">Superposición editorial en español sobre la captura histórica intacta, a escala nativa. No es una captura nativa.</desc>
<rect id="mask-1" x="38" y="31" width="366" height="43" fill="#ffffff"/>
<text x="39" y="64.40" font-family="DejaVu Sans" font-size="34" font-weight="bold" fill="#111318">Conectar billetera</text>
<rect id="mask-2" x="38" y="126" width="167" height="33" fill="#ffffff"/>
<text x="39" y="151.95" font-family="DejaVu Sans" font-size="27" font-weight="bold" fill="#1b48df">Instalada</text>
<rect id="mask-3" x="38" y="290" width="354" height="35" fill="#ffffff"/>
<text x="39" y="316.95" font-family="DejaVu Sans" font-size="27" font-weight="bold" fill="#5c6060">Billeteras compatibles</text>
<rect id="mask-5" x="676" y="136" width="394" height="39" fill="#ffffff"/>
<text x="677" y="166.70" font-family="DejaVu Sans" font-size="31" font-weight="bold" fill="#111318">¿Qué es una billetera?</text>
<rect id="mask-6" x="644" y="301" width="500" height="35" fill="#ffffff"/>
<text x="645" y="327.60" font-family="DejaVu Sans" font-size="25" font-weight="bold" fill="#111318">Un lugar para sus activos digitales</text>
<rect id="mask-7" x="644" y="344" width="515" height="71" fill="#ffffff"/>
<text x="645" y="373" font-family="DejaVu Sans" font-size="23" font-weight="normal" fill="#5c6060">Las billeteras permiten enviar, recibir,</text>
<text x="645" y="404" font-family="DejaVu Sans" font-size="23" font-weight="normal" fill="#5c6060">almacenar y mostrar activos digitales como</text>
<rect id="mask-12" x="778" y="418" width="50" height="31" fill="#ffffff"/>
<text x="779" y="441" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#5c6060">y</text>
<rect id="mask-8" x="644" y="517" width="500" height="36" fill="#ffffff"/>
<text x="645" y="544.10" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#111318">Una nueva forma de iniciar sesión</text>
<rect id="mask-9" x="644" y="562" width="510" height="103" fill="#ffffff"/>
<text x="645" y="592.75" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#5c6060">En vez de crear cuentas y contraseñas</text>
<text x="645" y="622.25" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#5c6060">en cada sitio web, conecte</text>
<text x="645" y="651.75" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#5c6060">su billetera.</text>
<rect id="mask-10" x="744" y="756" width="169" height="31" fill="#1345ed"/>
<text x="745" y="778.15" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="#ffffff">Obtener billetera</text>
<rect id="mask-11" x="748" y="834" width="165" height="33" fill="#ffffff"/>
<text x="749" y="857.15" font-family="DejaVu Sans" font-size="17.5" font-weight="bold" fill="#1b48df">Más información</text>
<rect x="0" y="890" width="1220" height="74" fill="#eef2f7"/>
<text x="18" y="919" font-family="DejaVu Sans" font-size="22" font-weight="bold" fill="#172033">Versión editada en español</text>
<text x="18" y="945" font-family="DejaVu Sans" font-size="16" fill="#172033">Traducción educativa; no es una captura nativa.</text>
