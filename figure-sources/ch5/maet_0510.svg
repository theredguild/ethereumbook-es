<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="890" viewBox="0 0 1450 890" lang="es-419"><title>Flujo de recuperación social</title><desc>Una transacción entra al contrato de billetera por la clave pública de firma. Flechas discontinuas relacionan la clave y los guardianes: tres de cinco guardianes pueden cambiar la clave, y la clave puede cambiar guardianes tras una demora.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#151515"/></marker></defs><g font-family="DejaVu Sans" fill="#151515" stroke-linejoin="round" stroke-linecap="round">
<rect x="660" y="5" width="780" height="875" rx="20" fill="none" stroke="#151515" stroke-width="4"/>
<text x="680" y="59" text-anchor="start" font-size="32" font-weight="bold" fill="#151515"><tspan x="680" dy="0">Contrato de billetera</tspan></text>
<text x="292" y="140" text-anchor="middle" font-size="24" font-weight="normal" fill="#151515"><tspan x="292" dy="0">Las transacciones (transferencias de ETH,</tspan><tspan x="292" dy="29">transferencias ERC-20, llamadas a</tspan><tspan x="292" dy="29">contratos inteligentes...) deben incluir</tspan><tspan x="292" dy="29">firmas realizadas por la clave pública</tspan><tspan x="292" dy="29">de firma.</tspan></text>
<path d="M575 200H710" fill="none" stroke="#151515" stroke-width="6" marker-end="url(#arrow)"/>
<rect x="715" y="120" width="230" height="170" rx="14" fill="#b3d5e8" stroke="#151515" stroke-width="3"/>
<text x="830.0" y="197.17000000000002" text-anchor="middle" font-size="29" font-weight="normal" fill="#151515"><tspan x="830.0" dy="0">Clave pública</tspan><tspan x="830.0" dy="35.38">de firma</tspan></text>
<text x="1175" y="96" text-anchor="middle" font-size="25" font-weight="normal" fill="#151515" font-style="italic"><tspan x="1175" dy="0">Tres de cinco guardianes</tspan><tspan x="1175" dy="30.5">pueden cambiar la</tspan><tspan x="1175" dy="30.5">clave pública de firma</tspan></text>
<path d="M1248 390V200H947" fill="none" stroke="#151515" stroke-width="5" stroke-dasharray="5 13" marker-end="url(#arrow)"/>
<path d="M830 290V601H1105" fill="none" stroke="#151515" stroke-width="5" stroke-dasharray="5 13" marker-end="url(#arrow)"/>
<rect x="1110" y="390" width="280" height="430" rx="14" fill="#b3d5e8" stroke="#151515" stroke-width="3"/>
<text x="1250" y="441" text-anchor="middle" font-size="28" font-weight="bold" fill="#151515"><tspan x="1250" dy="0">Direcciones de</tspan><tspan x="1250" dy="34.16">los guardianes</tspan></text>
<text x="1250" y="565" text-anchor="middle" font-size="31" font-weight="normal" fill="#151515"><tspan x="1250" dy="0">0x12345...</tspan><tspan x="1250" dy="37.82">0x6789a...</tspan><tspan x="1250" dy="37.82">0xbcdef...</tspan><tspan x="1250" dy="37.82">0x54321...</tspan><tspan x="1250" dy="37.82">0xa9876...</tspan></text>
<text x="878" y="660" text-anchor="middle" font-size="25" font-weight="normal" fill="#151515" font-style="italic"><tspan x="878" dy="0">Un mensaje firmado con</tspan><tspan x="878" dy="30.5">la clave de firma puede</tspan><tspan x="878" dy="30.5">cambiar los guardianes</tspan><tspan x="878" dy="30.5">tras una demora (a menudo</tspan><tspan x="878" dy="30.5">de uno a tres días).</tspan></text>
</g></svg>