<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="850" viewBox="0 0 1480 850" lang="es-419"><title>De la frase mnemónica a la semilla</title><desc>Los pasos siete y ocho muestran palabras mnemónicas y sal. El paso nueve usa PBKDF2 con HMAC-SHA512 y 2048 rondas para obtener la semilla de 512 bits.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#151515"/></marker></defs><g font-family="DejaVu Sans" fill="#151515" stroke-linejoin="round" stroke-linecap="round">
<rect x="5" y="5" width="1470" height="840" rx="18" fill="none" stroke="#151515" stroke-width="3"/>
<text x="740" y="64" text-anchor="middle" font-size="38" font-weight="bold" fill="#151515"><tspan x="740" dy="0">De la frase mnemónica a la semilla</tspan></text>
<circle cx="75" cy="111" r="28" fill="white" stroke="#151515" stroke-width="3"/>
<text x="75" y="120" text-anchor="middle" font-size="28" font-weight="normal" fill="#151515"><tspan x="75" dy="0">7</tspan></text>
