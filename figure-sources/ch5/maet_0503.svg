<text x="1400" y="120" text-anchor="middle" font-size="28" font-weight="normal" fill="#151515"><tspan x="1400" dy="0">8</tspan></text>
<rect x="38" y="150" width="700" height="150" rx="14" fill="#b3d5e8" stroke="#151515" stroke-width="3"/>
<text x="388" y="193" text-anchor="middle" font-size="29" font-weight="bold" fill="#151515"><tspan x="388" dy="0">Palabras del código mnemónico</tspan></text>
<text x="388" y="238" text-anchor="middle" font-size="24" font-weight="normal" fill="#151515" font-family="DejaVu Sans Mono"><tspan x="388" dy="0">“army van defense carry jealous true</tspan><tspan x="388" dy="29.28">garbage claim echo media make crunch”</tspan></text>
<rect x="752" y="150" width="690" height="150" rx="14" fill="#b3d5e8" stroke="#151515" stroke-width="3"/>
<text x="1097" y="200" text-anchor="middle" font-size="31" font-weight="bold" fill="#151515"><tspan x="1097" dy="0">Sal</tspan></text>
<text x="1097" y="246" text-anchor="middle" font-size="25" font-weight="normal" fill="#151515"><tspan x="1097" dy="0">“mnemonic” + frase de contraseña opcional</tspan></text>
<path d="M510 360H970Q985 360 985 375V480Q985 495 970 495H795V535H845Q858 535 849 549L740 656L631 549Q622 535 635 535H685V495H510Q495 495 495 480V375Q495 360 510 360Z" fill="#009447" stroke="#151515" stroke-width="4"/>
<text x="740" y="392" text-anchor="middle" font-size="24" font-weight="bold" fill="white"><tspan x="740" dy="0">Función de estiramiento</tspan><tspan x="740" dy="29">de claves</tspan></text>
<text x="740" y="451" text-anchor="middle" font-size="27" font-weight="normal" fill="white"><tspan x="740" dy="0">PBKDF2 con HMAC-SHA512</tspan></text>
<text x="740" y="554" text-anchor="middle" font-size="28" font-weight="normal" fill="white"><tspan x="740" dy="0">2048</tspan><tspan x="740" dy="34.16">rondas</tspan></text>
<circle cx="620" cy="600" r="28" fill="white" stroke="#151515" stroke-width="3"/>
<text x="620" y="609" text-anchor="middle" font-size="28" font-weight="normal" fill="#151515"><tspan x="620" dy="0">9</tspan></text>
