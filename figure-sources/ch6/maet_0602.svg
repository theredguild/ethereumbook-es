<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" lang="es-419"><title>Designador de delegación</title><desc>Una EOA designa el contrato A. Otra EOA recibe una transacción y ejecuta código en ese contrato.</desc><defs><marker id="black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#111"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#c82333"/></marker><g id="person"><circle cx="0" cy="0" r="26" fill="#d7b7a5" stroke="#111" stroke-width="4"/><path d="M-48 90 -40 42 -15 30 0 48 15 30 40 42 48 90Z" fill="#333" stroke="#111" stroke-width="4"/><path d="M-12 36 0 75 12 36 0 48Z" fill="#1689b8"/></g></defs><g font-family="DejaVu Sans" font-size="30" text-anchor="middle"><rect x="3" y="3" width="215" height="270" rx="20" fill="white" stroke="#111" stroke-width="5"/><use href="#person" x="110" y="70"/><text x="110" y="240">EOA</text><rect x="350" y="245" width="215" height="270" rx="20" fill="white" stroke="#111" stroke-width="5"/><use href="#person" x="457" y="310"/><text x="457" y="480">EOA</text><rect x="735" y="60" width="260" height="155" rx="20" fill="#b2d3e7" stroke="#111" stroke-width="5"/><text x="865" y="120">Contrato</text><text x="865" y="160">inteligente A</text><path d="M218 140H730" fill="none" stroke="#111" stroke-width="7" marker-end="url(#black)"/><text x="475" y="118" font-size="27">Designador de delegación</text><path d="M8 375H345" fill="none" stroke="#c82333" stroke-width="7" marker-end="url(#red)"/><text x="170" y="350" fill="#c82333">Transacción</text><path d="M565 375H865V220" fill="none" stroke="#c82333" stroke-width="7" marker-end="url(#red)"/><text x="715" y="345" font-size="25" fill="#c82333">Ejecuta código en</text></g></svg>