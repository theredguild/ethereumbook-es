<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="565" viewBox="0 0 1000 565" lang="es-419"><title>Ataque sándwich</title><desc>tx0 compra 10 tokens xyz antes de tx1. tx2 vende 10 tokens xyz después de tx1. Transacciones del atacante verdes; transacción del usuario rosa.</desc><g stroke="#111" stroke-width="5"><rect x="3" y="185" width="455" height="95" rx="20" fill="#009444"/><rect x="3" y="303" width="455" height="95" rx="20" fill="#009444"/><rect x="490" y="3" width="507" height="559" rx="20" fill="white"/><rect x="512" y="145" width="462" height="95" rx="20" fill="#009444"/><rect x="512" y="263" width="462" height="95" rx="20" fill="#e5abad"/><rect x="512" y="381" width="462" height="95" rx="20" fill="#009444"/></g><g font-family="DejaVu Sans" font-size="32" text-anchor="middle"><text x="230" y="246" font-size="29" fill="white">tx0: comprar 10 tokens xyz</text><text x="230" y="364" font-size="29" fill="white">tx2: vender 10 tokens xyz</text><text x="743" y="60" font-size="40">Bloque</text><text x="743" y="128" font-size="45">•••</text><text x="743" y="206" fill="white">tx0</text><text x="743" y="324">tx1</text><text x="743" y="442" fill="white">tx2</text><text x="743" y="520" font-size="45">•••</text></g></svg>