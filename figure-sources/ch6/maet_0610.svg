<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" lang="es-419">
<title>Firma sin conexión</title><desc>Red Ethereum y computadora en línea sincronizadas en ambas direcciones. Código QR o USB dentro de aislamiento físico. Dos flechas vuelven a computadora en línea; otras dos apuntan a computadora sin conexión y claves de firma.</desc>
